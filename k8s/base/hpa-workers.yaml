apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: niitsyllabriq-workers
  namespace: niitsyllabriq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: niitsyllabriq-workers
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
