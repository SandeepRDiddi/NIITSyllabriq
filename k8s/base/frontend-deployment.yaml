apiVersion: apps/v1
kind: Deployment
metadata:
  name: niitsyllabriq-frontend
  namespace: niitsyllabriq
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: niitsyllabriq-frontend
  template:
    metadata:
      labels:
        app: niitsyllabriq-frontend
    spec:
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
