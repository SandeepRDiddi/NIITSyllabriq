apiVersion: apps/v1
kind: Deployment
metadata:
  name: niitsyllabriq-api
  namespace: niitsyllabriq
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: niitsyllabriq-api
  template:
    metadata:
      labels:
        app: niitsyllabriq-api
    spec:
      containers:
        - name: api
          image: __BACKEND_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: niitsyllabriq-config
            - secretRef:
                name: niitsyllabriq-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
