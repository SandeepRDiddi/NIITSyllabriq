# Docker Compose reads a file named exactly ".env" in this directory automatically.
# Copy .env.example to .env and fill in your values before running:
#   cp .env.example .env   (Linux/Mac)
#   Copy-Item .env.example .env   (Windows PowerShell)

services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed — only reachable by other containers in this stack
    healthcheck:
      # pg_isready checks that PostgreSQL is actually accepting connections,
      # not just that the container has started
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  design-automation:
    build: .
    environment:
      DATABASE_URL:              postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Ollama runs on the host machine, not inside Docker
      OLLAMA_BASE_URL:           http://host.docker.internal:11434
      OLLAMA_GENERATION_MODEL:   ${OLLAMA_GENERATION_MODEL}
      OLLAMA_EMBED_MODEL:        ${OLLAMA_EMBED_MODEL}
      PRIMARY_REVIEWERS:         ${PRIMARY_REVIEWERS}
      FINAL_REVIEWERS:           ${FINAL_REVIEWERS}
      JWT_SECRET_KEY:            ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS:           ${ALLOWED_ORIGINS}
    volumes:
      - ./app/storage:/app/app/storage
    depends_on:
      postgres:
        condition: service_healthy   # wait until pg_isready passes, not just container start
    # No ports exposed — NGINX is the only entry point

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Relative path — works on any domain automatically via NGINX
        VITE_API_BASE_URL: /api
    depends_on:
      - design-automation
    # No ports exposed — NGINX is the only entry point

  # ── NGINX Reverse Proxy ─────────────────────────────────────────────────────
  # Single entry point for all traffic:
  #   /api/*  →  FastAPI backend (port 8000 internally)
  #   /*      →  React frontend  (port 8080 internally)
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - design-automation

volumes:
  postgres_data:
