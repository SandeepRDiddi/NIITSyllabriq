version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: niit
      POSTGRES_PASSWORD: niit
      POSTGRES_DB: niit_design_automation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  design-automation:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://niit:niit@postgres:5432/niit_design_automation
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_GENERATION_MODEL: qwen2.5:7b-instruct
      OLLAMA_EMBED_MODEL: nomic-embed-text
      PRIMARY_REVIEWERS: primary.reviewer@niit.com
      FINAL_REVIEWERS: final.reviewer1@niit.com,final.reviewer2@niit.com
      JWT_SECRET_KEY: change-me-in-production
      ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./app/storage:/app/app/storage
    depends_on:
      - ollama
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on:
      - design-automation

volumes:
  ollama_data:
  postgres_data:
