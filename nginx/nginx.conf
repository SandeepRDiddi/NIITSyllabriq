server {
    listen 80;
    server_name _;

    # Large file uploads (training docs, requirements)
    client_max_body_size 50M;

    # API requests — strip the /api prefix, forward to FastAPI backend
    # Example: /api/auth/login  →  http://design-automation:8000/auth/login
    location /api/ {
        proxy_pass         http://design-automation:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow slow AI generation calls to complete (up to 5 minutes)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # Swagger UI — lets you test the API from a browser at /docs
    location /docs {
        proxy_pass         http://design-automation:8000/docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass         http://design-automation:8000/openapi.json;
        proxy_set_header   Host              $host;
    }

    # Everything else — serve the React frontend (SPA)
    # The frontend container runs Nginx internally on port 8080
    location / {
        proxy_pass         http://frontend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
