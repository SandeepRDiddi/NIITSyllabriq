version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niit}
      POSTGRES_DB: ${POSTGRES_DB:-niit_design_automation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niit} -d ${POSTGRES_DB:-niit_design_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-NIIT Design Automation}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_TIMEOUT_SECONDS: ${OLLAMA_EMBED_TIMEOUT_SECONDS:-10}
      TRAINING_USE_LLM_NORMALIZATION: ${TRAINING_USE_LLM_NORMALIZATION:-false}
      TRAINING_EMBED_ON_UPLOAD: ${TRAINING_EMBED_ON_UPLOAD:-false}
      TRAINING_CHUNK_MAX_CHARS: ${TRAINING_CHUNK_MAX_CHARS:-1800}
      TRAINING_MAX_CHUNKS_PER_DOCUMENT: ${TRAINING_MAX_CHUNKS_PER_DOCUMENT:-40}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.78}
      PRIMARY_REVIEWERS: ${PRIMARY_REVIEWERS:-primary.reviewer@niit.com}
      FINAL_REVIEWERS: ${FINAL_REVIEWERS:-final.reviewer1@niit.com,final.reviewer2@niit.com}
      EXPORT_DIR: ${EXPORT_DIR:-app/storage/designs}
      REQUIREMENT_DIR: ${REQUIREMENT_DIR:-app/storage/requirements}
      TEMPLATE_DIR: ${TEMPLATE_DIR:-app/templates/designs}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - app_storage:/app/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  app_storage:
